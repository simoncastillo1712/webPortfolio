[build]
builder = "nixpacks"
buildCommand = "cd config && python manage.py collectstatic --noinput"

[deploy]
startCommand = "cd config && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
